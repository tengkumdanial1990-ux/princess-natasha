<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Princess Natasha — Royal Money Adventure</title>
<style>
:root{--ink:#3f315f;--pink:#f38dca;--purple:#a78af0;--cream:#fff9f0}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;font-family:system-ui,-apple-system,sans-serif;color:var(--ink);background:#aee2fa}
#world{position:fixed;inset:0;overflow:hidden;background:linear-gradient(#aee2fa 0 46%,#d1f5ff 46% 100%)}
#sun{position:absolute;right:9%;top:14%;width:58px;height:58px;border-radius:50%;background:#fff0a8;box-shadow:0 0 0 14px #fff0a833,0 0 55px #fff6b9}
.cloud{position:absolute;width:90px;height:24px;background:#ffffffb8;border-radius:30px;top:22%;left:10%;filter:blur(.2px)}.cloud:before,.cloud:after{content:"";position:absolute;background:inherit;border-radius:50%;bottom:5px}.cloud:before{width:36px;height:36px;left:15px}.cloud:after{width:28px;height:28px;left:43px}
#island{position:absolute;width:min(115vw,780px);height:min(95vw,650px);min-width:570px;min-height:490px;left:50%;top:53%;transform:translate(-50%,-50%) rotateX(52deg) rotateZ(-1deg);border-radius:46%;background:linear-gradient(135deg,#8be19b,#59c97e);border:12px solid #51b66d;box-shadow:0 24px 0 #ba8b66,0 38px 0 #8d6b69,0 45px 45px #477b8a55;transform-style:preserve-3d}
.path{position:absolute;background:#f6d9ac;border:5px solid #e9bf91;border-radius:40px;box-shadow:inset 0 0 0 4px #fff0cf}
#pathV{width:90px;height:88%;left:calc(50% - 45px);top:6%}#pathH{width:82%;height:70px;left:9%;top:47%}
#castle{position:absolute;left:50%;top:8%;width:180px;height:140px;transform:translateX(-50%);filter:drop-shadow(0 8px 0 #ba8d9b);z-index:2}
.castleBase{position:absolute;left:28px;bottom:0;width:124px;height:80px;background:#ffd5e9;border:5px solid #ef9fc8;border-radius:12px 12px 4px 4px;box-shadow:inset -10px 0 #e9a5cd}
.tower{position:absolute;bottom:50px;width:45px;height:88px;background:#f8b8dc;border:4px solid #e991c3;border-radius:9px 9px 0 0}.tower.l{left:8px}.tower.r{right:8px}
.tower:before{content:"";position:absolute;top:-29px;left:-5px;border-left:24px solid transparent;border-right:24px solid transparent;border-bottom:31px solid #a78af0}
.flag{position:absolute;top:-45px;left:19px;width:4px;height:25px;background:#9a75db}.flag:after{content:"";position:absolute;left:3px;top:0;border-top:8px solid #ffcf4a;border-bottom:8px solid #ffcf4a;border-right:15px solid transparent}
.door{position:absolute;bottom:0;left:76px;width:28px;height:45px;background:#a16eaa;border-radius:15px 15px 0 0;border:3px solid #85558f}.window{position:absolute;bottom:35px;left:49px;width:18px;height:24px;background:#8bdcf5;border:3px solid white;border-radius:10px}
#fountain{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:95px;height:62px;border-radius:50%;background:#93dff5;border:8px solid #fff0dc;box-shadow:0 9px 0 #dfb68d;z-index:4}
#fountain:before{content:"";position:absolute;width:34px;height:31px;left:23px;top:-22px;background:#b4ecf8;border:5px solid #fff0dc;border-radius:50% 50% 35% 35%;box-shadow:0 0 10px #fff}
#fountain:after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;background:#55c7f1;left:31px;top:-29px}
.tree{position:absolute;width:54px;height:58px;z-index:3}.tree:before{content:"";position:absolute;bottom:0;left:23px;width:12px;height:34px;background:#a96d4c;border-radius:6px}.tree:after{content:"";position:absolute;top:0;left:0;width:54px;height:47px;background:#45c879;border-radius:48% 52% 45% 50%;box-shadow:inset -8px -4px #35b66b,0 5px 0 #2da85c}
#tree1{left:12%;top:25%}#tree2{right:13%;top:22%}#tree3{left:10%;bottom:19%}#tree4{right:11%;bottom:17%}
#shop{position:absolute;right:9%;top:45%;width:100px;height:85px;z-index:5;filter:drop-shadow(0 7px 0 #b98d74)}
.shopBody{position:absolute;bottom:0;width:100%;height:56px;background:#fff0d5;border:4px solid #e8b98e;border-radius:7px}.shopRoof{position:absolute;top:0;left:-7px;width:114px;height:30px;background:repeating-linear-gradient(90deg,#f38dca 0 18px,#ffb7de 18px 36px);clip-path:polygon(8% 0,92% 0,100% 100%,0 100%);border-radius:5px}.shopSign{position:absolute;top:32px;left:22px;font-size:12px;font-weight:900;background:#fff;border-radius:5px;padding:2px 7px}
#pig{position:absolute;left:12%;top:48%;width:65px;height:54px;z-index:5}
.pigBody{position:absolute;left:4px;bottom:0;width:57px;height:40px;border-radius:48%;background:#ff9fcf;border:3px solid #ef79b8;box-shadow:inset -7px -4px #f18abd}
.pigEar{position:absolute;top:0;width:17px;height:22px;background:#ffacd7;border:3px solid #ef79b8;border-radius:70% 30% 45% 45%;transform:rotate(-20deg)}.pigEar.one{left:9px}.pigEar.two{right:9px;transform:rotate(20deg)}
.pigEye{position:absolute;top:22px;left:20px;width:5px;height:5px;border-radius:50%;background:#633c68;box-shadow:17px 0 #633c68}.pigNose{position:absolute;right:-4px;top:25px;width:14px;height:11px;border-radius:50%;background:#f47db6;border:2px solid #e96ba9}
#coins{position:absolute;inset:0;z-index:6;pointer-events:none}.coin{position:absolute;font-size:30px;filter:drop-shadow(0 4px 0 #c68c2d);animation:bob 1.5s ease-in-out infinite}.coin:nth-child(2n){animation-delay:-.7s}
@keyframes bob{50%{transform:translateY(-9px) rotate(8deg)}}
#princess{position:absolute;left:50%;top:69%;width:64px;height:105px;z-index:8;transform:translate(-50%,-50%);transition:left .12s linear,top .12s linear;filter:drop-shadow(0 5px 1px #5b8d7860)}
#princess .hair{position:absolute;left:13px;top:16px;width:39px;height:34px;border-radius:48% 48% 42% 42%;background:#794052;z-index:1}
#princess .face{position:absolute;left:18px;top:19px;width:30px;height:31px;border-radius:48%;background:#f6c5a4;z-index:2}
#princess .eye{position:absolute;top:12px;width:4px;height:5px;border-radius:50%;background:#43304e}#princess .eye.a{left:7px}#princess .eye.b{right:7px}
#princess .crown{position:absolute;left:17px;top:8px;width:32px;height:16px;background:#ffcf4a;clip-path:polygon(0 100%,0 25%,25% 55%,40% 0,60% 55%,82% 10%,100% 25%,100% 100%);z-index:4}
#princess .dress{position:absolute;left:6px;top:48px;width:52px;height:46px;background:linear-gradient(90deg,#e96fb3,#ffb1dd 50%,#e96fb3);clip-path:polygon(30% 0,70% 0,100% 100%,0 100%);z-index:3}
#princess .arm{position:absolute;top:53px;width:11px;height:29px;background:#f6c5a4;border-radius:10px;z-index:2}.arm.a{left:4px;transform:rotate(18deg)}.arm.b{right:4px;transform:rotate(-18deg)}
#princess .feet{position:absolute;left:17px;top:88px;width:12px;height:12px;border-radius:5px;background:#8e5fb5;box-shadow:17px 0 #8e5fb5;z-index:2}
.panel{background:#fffaf3f2;border:2px solid white;border-radius:20px;box-shadow:0 8px 22px #607e9a24;backdrop-filter:blur(5px)}
#hud{position:fixed;z-index:20;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none}
#brand{padding:9px 12px;font-weight:950;font-size:14px;line-height:1.2;max-width:52%}#brand small{font-weight:650;font-size:11px}
#stats{padding:8px 10px;font-weight:850;font-size:13px;display:flex;gap:9px;align-items:center;flex-wrap:wrap;justify-content:flex-end;max-width:62%}
button{font:inherit;font-weight:850;border:0;border-radius:13px;background:linear-gradient(135deg,#ed8fc9,#a88af0);color:white;padding:10px 12px;box-shadow:0 4px 0 #8d70c8;cursor:pointer}
#quest{position:fixed;z-index:20;left:10px;top:105px;width:min(275px,67vw);padding:12px}
#quest h3{margin:0 0 5px;font-size:16px}#quest p{font-size:13px;line-height:1.35;margin:4px 0}
#hint{position:fixed;z-index:20;bottom:10px;left:50%;transform:translateX(-50%);width:max-content;max-width:70vw;padding:9px 12px;text-align:center;font-weight:800;font-size:12px}
#controls{touch-action:none;position:fixed;z-index:21;bottom:17px;left:12px;display:grid;grid-template-columns:48px 48px 48px;grid-template-rows:43px 43px;gap:5px;touch-action:none}
#controls button{padding:0;font-size:21px;opacity:.96}#controls button:nth-child(1){grid-column:2;grid-row:1}#controls button:nth-child(2){grid-column:1;grid-row:2}#controls button:nth-child(3){grid-column:2;grid-row:2}#controls button:nth-child(4){grid-column:3;grid-row:2}
#interact{position:fixed;z-index:21;right:15px;bottom:26px;width:76px;height:76px;border-radius:50%;font-size:20px;line-height:1.05}
#interact small{font-size:10px}
#story{position:fixed;z-index:30;display:none;left:50%;top:50%;transform:translate(-50%,-50%);width:min(430px,calc(100vw - 28px));padding:20px}
#story h2{margin:0 0 8px}#story p{font-size:15px;line-height:1.55}
#storyActions{display:flex;gap:8px;flex-wrap:wrap}
#toast{position:fixed;z-index:40;top:48%;left:50%;transform:translate(-50%,-50%);display:none;padding:15px 20px;font-weight:900;text-align:center;width:max-content;max-width:85vw}
#dim{position:fixed;z-index:29;inset:0;background:#38275066;display:none}
@media(min-width:800px){#controls,#interact{opacity:.88}#quest{top:110px}#hint{bottom:14px}}
@media(max-width:390px){#stats{font-size:11px;gap:5px;padding:7px}#brand{font-size:12px}#quest{top:105px}#hint{bottom:116px;max-width:92vw}}
</style>
</head>
<body>
<div id="world">
 <div id="sun"></div><div class="cloud"></div><div class="cloud" style="top:31%;left:68%;transform:scale(.75)"></div>
 <div id="island">
  <div id="pathV" class="path"></div><div id="pathH" class="path"></div>
  <div id="castle"><div class="castleBase"></div><div class="tower l"><div class="flag"></div></div><div class="tower r"><div class="flag"></div></div><div class="door"></div><div class="window"></div></div>
  <div id="fountain"></div>
  <div id="tree1" class="tree"></div><div id="tree2" class="tree"></div><div id="tree3" class="tree"></div><div id="tree4" class="tree"></div>
  <div id="shop"><div class="shopBody"></div><div class="shopRoof"></div><div class="shopSign">SHOP</div></div>
  <div id="pig"><div class="pigEar one"></div><div class="pigEar two"></div><div class="pigBody"></div><div class="pigEye"></div><div class="pigNose"></div></div>
  <div id="coins"><span class="coin" style="left:35%;top:58%">🪙</span><span class="coin" style="left:62%;top:63%">🪙</span><span class="coin" style="left:25%;top:42%">🪙</span><span class="coin" style="left:72%;top:39%">🪙</span><span class="coin" style="left:47%;top:76%">🪙</span><span class="coin" style="left:18%;top:65%">🪙</span><span class="coin" style="left:81%;top:60%">🪙</span><span class="coin" style="left:55%;top:35%">🪙</span></div>
  <div id="princess"><div class="hair"></div><div class="face"><i class="eye a"></i><i class="eye b"></i></div><div class="crown"></div><div class="dress"></div><div class="arm a"></div><div class="arm b"></div><div class="feet"></div></div>
 </div>
</div>
<div id="hud"><div id="brand" class="panel">👑 PRINCESS NATASHA<br><small>Royal Money Adventure · 3D-style</small></div><div id="stats" class="panel"><span>🪙 <b id="money">10</b></span><span>🐷 <b id="saved">0</b></span><span>⭐ <b id="stars">0</b></span><button id="storyBtn">📖 Story</button></div></div>
<div id="quest" class="panel"><h3>✨ Royal mission</h3><p id="mission">Find the royal helper near the fountain.</p><p id="progress">Mission: Learn to earn</p></div>
<div id="hint" class="panel">Use arrows to move · Tap E to interact</div>
<div id="controls"><button data-dir="up">▲</button><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div>
<button id="interact">E<br><small>Interact</small></button>
<div id="dim"></div><div id="story" class="panel"><h2 id="storyTitle">📖 A Royal Beginning</h2><p id="storyBody"></p><div id="storyActions"><button id="listen">🔊 Listen</button><button id="prev" style="background:#fff;color:#654e8a;box-shadow:none">← Back</button><button id="next">Next →</button><button id="closeStory" style="background:#fff;color:#654e8a;box-shadow:none">Close</button></div></div>
<div id="toast" class="panel"></div>
<script>
(()=>{
const princess=document.getElementById('princess'),island=document.getElementById('island'),toast=document.getElementById('toast');
let x=50,y=69,money=10,saved=0,stars=0,mission=0,storyIndex=0,toastTimer,near='';
const collected=new Set(),coins=[...document.querySelectorAll('.coin')];
const pages=[
['A Royal Beginning','Good morning, Princess Natasha! The kingdom is getting ready for the Sparkle Festival, but the royal treasure chest is nearly empty. A friendly helper has a plan: Natasha can earn coins by helping people. Every little coin is a step towards something wonderful.'],
['Coins Have Choices','At the Royal Shop, Natasha sees sweets, a storybook and a teddy bear. She has to think about what she wants most. She can buy one thing now, or save her coins for a bigger surprise later. There is no wrong treat to enjoy — the trick is making a plan.'],
['The Magic of Saving','Every time Natasha puts coins in her piggy bank, her unicorn dream gets closer. Saving means keeping some money for something she wants in the future. She does not have to save every coin. She can choose how much to save and how much to spend.']
];
function hud(){document.getElementById('money').textContent=money;document.getElementById('saved').textContent=saved;document.getElementById('stars').textContent=stars;
document.getElementById('mission').textContent=mission===0?'Find the royal helper near the fountain and press E.':mission===1?'Collect the golden coins around the kingdom.':mission===2?'Visit the pink piggy bank and save some coins.':'Visit the Royal Shop and choose a treat you can afford.';
document.getElementById('progress').textContent=['Mission: Learn to earn','Mission: Collect coins ('+collected.size+'/8)','Mission: Build a saving habit','Mission: Spend wisely'][Math.min(mission,3)];
}
function say(t){toast.textContent=t;toast.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.style.display='none',2300)}
function move(dx,dy){x=Math.max(8,Math.min(92,x+dx));y=Math.max(20,Math.min(89,y+dy));princess.style.left=x+'%';princess.style.top=y+'%';checkNear();}
function checkNear(){const targets=[{name:'helper',x:50,y:42,label:'royal helper near the fountain'},{name:'pig',x:18,y:56,label:'pink piggy bank'},{name:'shop',x:80,y:51,label:'Royal Shop'}];near='';for(const t of targets){if(Math.hypot(x-t.x,y-t.y)<12){near=t.name;break}}
if(near)document.getElementById('hint').textContent='Near the '+({helper:'royal helper — tap E',pig:'piggy bank — tap E',shop:'shop — tap E'}[near])+' ✨';else document.getElementById('hint').textContent='Move with arrows · Collect coins · Tap E to interact';}
function openStory(i){storyIndex=(i+pages.length)%pages.length;document.getElementById('storyTitle').textContent='📖 '+pages[storyIndex][0];document.getElementById('storyBody').textContent=pages[storyIndex][1];document.getElementById('story').style.display='block';document.getElementById('dim').style.display='block';}
function closeStory(){document.getElementById('story').style.display='none';document.getElementById('dim').style.display='none';if(window.speechSynthesis)speechSynthesis.cancel()}
document.getElementById('storyBtn').onclick=()=>openStory(storyIndex);document.getElementById('closeStory').onclick=closeStory;document.getElementById('next').onclick=()=>openStory(storyIndex+1);document.getElementById('prev').onclick=()=>openStory(storyIndex-1);
document.getElementById('listen').onclick=()=>{if(!('speechSynthesis'in window)){say('Audio narration is not supported in this browser.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(pages[storyIndex][1]);u.lang='en-SG';u.rate=.88;u.pitch=1.12;speechSynthesis.speak(u)};
function interact(){if(document.getElementById('story').style.display==='block')return;
if(near==='helper'){if(mission===0){money+=5;stars++;mission=1;hud();say('The helper gives Natasha 5 coins! Collect the shiny coins next. 🪙')}else{say('You can do it, Princess Natasha! Explore the kingdom and collect coins. ✨')}}
else if(near==='pig'){if(money>=5){money-=5;saved+=5;stars++;mission=Math.max(mission,3);hud();say('You saved 5 coins! Your unicorn dream is closer. 🐷')}else say('Earn a few more coins before saving. Every coin counts!')}
else if(near==='shop'){let choice=prompt('ROYAL SHOP\\nYou have '+money+' coins.\\nType 1 to buy a storybook for 4 coins.\\nType 2 to buy a sparkly wand for 8 coins.\\nType 3 to keep saving.');if(choice==='1'&&money>=4){money-=4;stars++;mission=3;hud();say('A storybook! A lovely choice, Natasha. 📚')}else if(choice==='2'&&money>=8){money-=8;stars++;mission=3;hud();say('The sparkly wand is yours! ✨')}else if(choice==='3')say('Great plan! You can come back when you are ready.');else if(choice!==null)say('Not enough coins for that yet. Keep exploring!');}
else say('Walk around to find the helper, piggy bank, shop and golden coins!');}
document.getElementById('interact').onclick=interact;
document.getElementById('interact').addEventListener('touchend',e=>{e.preventDefault();interact()},{passive:false});
document.querySelectorAll('[data-dir]').forEach(b=>{
 let timer=null;
 const step=()=>{const d=b.dataset.dir;if(d==='up')move(0,-3);if(d==='down')move(0,3);if(d==='left')move(-3,0);if(d==='right')move(3,0)};
 const stop=()=>{if(timer!==null){clearInterval(timer);timer=null}};
 // Support tap, touch, and pointer events in mobile in-app browsers.
 b.addEventListener('click',e=>{e.preventDefault();step()});
 b.addEventListener('pointerdown',e=>{e.preventDefault();step();stop();timer=setInterval(step,180)});
 b.addEventListener('touchstart',e=>{e.preventDefault();step();stop();timer=setInterval(step,180)},{passive:false});
 ['pointerup','pointerleave','pointercancel','touchend','touchcancel','blur'].forEach(ev=>b.addEventListener(ev,stop));
});
document.addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(k==='arrowup'||k==='w')move(0,-2.3);else if(k==='arrowdown'||k==='s')move(0,2.3);else if(k==='arrowleft'||k==='a')move(-2.3,0);else if(k==='arrowright'||k==='d')move(2.3,0);else if(k==='e'||k===' ')interact();else if(k==='escape')closeStory()});
coins.forEach((c,i)=>c.addEventListener('click',()=>collect(i)));
function collect(i){if(collected.has(i))return;collected.add(i);coins[i].style.visibility='hidden';money++;hud();say('+1 gold coin! 🪙');if(collected.size===8){mission=Math.max(mission,2);stars++;hud();say('All 8 coins collected! You are a royal treasure hunter! ⭐')}}
coins.forEach((c,i)=>{c.style.pointerEvents='auto';c.style.cursor='pointer';c.addEventListener('touchstart',()=>collect(i),{passive:true})});
hud();checkNear();
})();
</script>
</body>
</html>
